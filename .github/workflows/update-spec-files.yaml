name: Update Spec Files

on:
  # Run bi-weekly on Monday at 9am UTC
  schedule:
    - cron: "0 9 * * 1/2"

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-specs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check for new Splunk versions
        id: check
        run: node scripts/update-spec-files.js --check-only --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open reminder issue
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        env:
          VERSIONS: ${{ steps.check.outputs.versions }}
        with:
          script: |
            const versions = process.env.VERSIONS;
            const title = `New Splunk spec files available: ${versions}`;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              core.info(`Reminder already open: #${existing.number}`);
              return;
            }

            const body = [
              `Splunk ${versions} spec files are available in [jewnix/splunk-spec-files](https://github.com/jewnix/splunk-spec-files/tags) but are not in \`spec_files/\`.`,
              '',
              '### To add them',
              '1. Create a branch from `master`.',
              '2. For each version: `node scripts/update-spec-files.js --version <X.Y>`',
              '   - downloads `spec_files/<X.Y>/` and adds it to `splunk.spec.FileVersion` in `package.json` (as the new default)',
              '3. `node scripts/update-spec-files.js --generate-rules` to add rules for newly deprecated settings to `resources/semantic_rules.json`',
              '4. Review new and deprecated settings in the new spec files and adjust `resources/semantic_rules.json` as needed (see `.github/copilot-instructions.md`)',
              '5. Run `npm test`, then open a pull request.',
              '',
              '---',
              '*Opened by the Update Spec Files workflow. While this issue is open, the workflow will not open another one for the same versions. Close it once the spec files are merged.*',
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['spec-files', 'automated'],
            });
            core.info(`Opened reminder #${issue.data.number}`);

      - name: Summary
        if: always()
        run: |
          echo "## Spec File Check" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.has_updates }}" == "true" ]; then
            echo "- New versions available: ${{ steps.check.outputs.versions }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No new versions available" >> $GITHUB_STEP_SUMMARY
          fi
