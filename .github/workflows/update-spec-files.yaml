name: Update Spec Files

on:
  # Run bi-weekly on Monday at 9am UTC
  schedule:
    - cron: "0 9 * * 1/2"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to download (e.g., 10.3)"
        required: false
        type: string
      dry_run:
        description: "Dry run (no file changes)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-specs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for updates
        id: check
        run: |
          node scripts/update-spec-files.js --check-only --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download new spec files
        id: download
        if: steps.check.outputs.has_updates == 'true' || github.event.inputs.version
        run: |
          ARGS="--verbose --output-report"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS="$ARGS --version ${{ github.event.inputs.version }}"
          fi
          node scripts/update-spec-files.js $ARGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run deprecation analysis
        id: analyze
        if: steps.check.outputs.has_updates == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          node scripts/update-spec-files.js --generate-rules --verbose

      - name: Run tests
        if: steps.check.outputs.has_updates == 'true' && github.event.inputs.dry_run != 'true'
        run: npm test

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update spec files and extension settings for Splunk ${{ steps.check.outputs.versions }}"
          title: "chore: Update Splunk spec files (${{ steps.check.outputs.versions }})"
          body-path: spec-update-report.md
          branch: automated/spec-file-update
          delete-branch: true
          labels: |
            automated
            spec-files
            ${{ steps.analyze.outputs.has_breaking_changes == 'true' && 'breaking-change' || '' }}

      - name: Create Copilot review issue
        if: steps.check.outputs.has_updates == 'true' && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const versions = '${{ steps.check.outputs.versions }}';
            const hasBreaking = '${{ steps.analyze.outputs.has_breaking_changes }}' === 'true';

            const body = `## Task
            Review the spec file changes for Splunk ${versions} and update semantic linting rules.

            ## What Changed
            - New spec file versions downloaded: ${versions}
            - Extension settings updated: \`splunk.spec.FileVersion\` enum and default in \`package.json\`
            - Breaking changes detected: ${hasBreaking ? 'Yes ⚠️' : 'No'}

            ## Instructions
            1. Compare spec files between the previous and new versions in \`spec_files/\`
            2. Look for new deprecations (search for "DEPRECATED" in docstrings)
            3. For each new deprecation found:
               - Check if a rule already exists in \`resources/semantic_rules.json\`
               - If not, add rules following the patterns in \`.github/copilot-instructions.md\`
            4. Verify rules match the schema in \`resources/semantic_rules.schema.json\`
            5. Verify \`package.json\` has the new version in \`splunk.spec.FileVersion\` enum
            6. Run \`npm test\` to ensure tests pass
            7. Create a PR with the changes

            ## Reference Files
            - Spec files: \`spec_files/<version>/*.spec\`
            - Extension settings: \`package.json\` (contributes.configuration.properties)
            - Semantic rules: \`resources/semantic_rules.json\`
            - Rule schema: \`resources/semantic_rules.schema.json\`
            - Deprecation analysis script: \`scripts/update-spec-files.js\`
            - Copilot instructions: \`.github/copilot-instructions.md\`

            ## Deprecation Patterns to Look For
            \`\`\`
            DEPRECATED
            deprecated in <version>
            Use 'new_setting' instead
            replaced by 'new_setting'
            removed
            no longer supported
            \`\`\`
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: \`Review spec file changes and update semantic rules for Splunk \${versions}\`,
              body: body,
              labels: ['copilot', 'automated', 'semantic-rules'],
              assignees: ['copilot']
            });

            console.log(\`Created Copilot review issue for versions: \${versions}\`);

      - name: Summary
        if: always()
        run: |
          echo "## Spec File Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.has_updates }}" == "true" ]; then
            echo "- New versions found: ${{ steps.check.outputs.versions }}" >> $GITHUB_STEP_SUMMARY
            echo "- Updated package.json FileVersion enum and default" >> $GITHUB_STEP_SUMMARY
            echo "- Created Copilot review issue" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No new versions available" >> $GITHUB_STEP_SUMMARY
          fi
