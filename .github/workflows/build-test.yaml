name: Build and test
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  unit-test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      # Without this a failure in one OS will cancel jobs running for others
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'
  functional-test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      # Without this a failure in one OS will cancel jobs running for others
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run compile-tests
      - name: Fix VS Code permissions (macOS ARM)
        if: runner.os == 'macOS'
        run: |
          VSCODE_PATH=$(find .vscode-test -name "Electron" -type f 2>/dev/null | head -1)
          if [ -n "$VSCODE_PATH" ]; then
            chmod +x "$VSCODE_PATH"
          fi
      - run: echo "Run acceptance tests" && node ./out/test/runFunctionalTests.js
        if: runner.os == 'macOS'
      - run: echo "Run acceptance tests" && xvfb-run -a node ./out/test/runFunctionalTests.js
        if: runner.os == 'Linux'
      - run: echo "Run acceptance tests" && node .\out\test\runFunctionalTests.js
        if: runner.os == 'Windows'
